version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: drashti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drashti
      POSTGRES_PASSWORD: drashti_dev_password
      POSTGRES_DB: drashti
    ports:
      - "5432:5432"
    volumes:
      - drashti_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: drashti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: drashti-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drashti
      MINIO_ROOT_PASSWORD: drashti_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - drashti_minio:/data

volumes:
  drashti_pgdata:
  drashti_minio:
